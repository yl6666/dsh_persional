openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
paths:
  /orders:
    get:
      operationId: listOrders
      responses:
        "200":
          description: order list
    post:
      operationId: createOrder
      responses:
        "201":
          description: created
  /orders/{id}:
    get:
      operationId: getOrder
      responses:
        "200":
          description: one order
